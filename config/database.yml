default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "geolocations_api_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "geolocations_api_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
